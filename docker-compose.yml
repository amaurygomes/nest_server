services:
  redis:
    image: redis:7-alpine
    container_name: nest_server_redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secret_password}
    environment:

      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret_password}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
